<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Consent Mode: inicialização reutilizável (ver consent-init.js) -->
    <script src="consent-init.js"></script>

    <!-- Google Tag Manager (reutilizável) -->
    <script src="gtm-init.js" data-gtm-id="GTM-KBPG55VP"></script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>GA4 + GTM Playground</title>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KBPG55VP"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <h1>Playground GA4 + GTM</h1>
    <!-- Navegação para páginas de teste -->
    <nav style="margin:12px 0">
      <a href="pagina-teste-1.html" style="margin-right:12px">Página Teste 1</a>
      <a href="pagina-teste-2.html" style="margin-right:12px">Página Teste 2</a>
      <a href="pagina-teste-3.html">Página Teste 3</a>
    </nav>
    <!-- Banner de consentimento com escolhas granulares -->
    <div id="consent-banner" style="position:fixed;left:16px;right:16px;bottom:16px;background:#fff;border:1px solid #ddd;padding:12px 16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08);z-index:9999;display:flex;align-items:center;gap:12px">
      <div style="flex:1">
        <strong>Usamos cookies para melhorar sua experiência</strong>
        <div style="font-size:0.95rem;color:#444;margin-top:6px">Selecione quais tipos de dados você autoriza que sejam coletados. As escolhas serão salvas no seu navegador.</div>

        <div style="margin-top:8px;display:flex;gap:12px;flex-wrap:wrap">
          <label style="font-size:0.95rem;display:flex;align-items:center;gap:8px"><input type="checkbox" id="consent-checkbox-analytics"> analytics_storage</label>
          <label style="font-size:0.95rem;display:flex;align-items:center;gap:8px"><input type="checkbox" id="consent-checkbox-ad"> ad_storage</label>
          <label style="font-size:0.95rem;display:flex;align-items:center;gap:8px"><input type="checkbox" id="consent-checkbox-ad-personalization"> ad_personalization</label>
          <label style="font-size:0.95rem;display:flex;align-items:center;gap:8px"><input type="checkbox" id="consent-checkbox-ad-user-data"> ad_user_data</label>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button id="consent-save" style="background:#0f9d58;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer">Salvar escolhas</button>
        <button id="consent-accept" style="background:#1a73e8;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer">Aceitar todos</button>
        <button id="consent-decline" style="background:#f1f3f4;color:#222;border:none;padding:8px 12px;border-radius:6px;cursor:pointer">Recusar todos</button>
      </div>
    </div>
    <p>Use os botões abaixo para enviar eventos de teste para o GTM.</p>

    <button onclick="sendEvent('button_click', { button_name: 'cta_topo' })">
      CTA Topo
    </button>

    <button
      onclick="sendEvent('add_to_cart', { item_id: '123', item_name: 'Produto X', price: 29.9 })"
    >
      Adicionar ao Carrinho
    </button>

    <button
      onclick="sendEvent('purchase', { transaction_id: 'TX999', value: 59.9 })"
    >
      Finalizar Compra
    </button>

    <hr />

    <button onclick="sendEvent('form_submit', { form_name: 'newsletter' })">
      Enviar Formulário
    </button>

    <!-- Campo para digitar e enviar 'select_content' -->
    <div style="margin-top:12px;display:flex;align-items:center;gap:8px">
      <label for="content-input" style="font-weight:600">Conteúdo:</label>
      <input id="content-input" type="text" placeholder="Digite o tipo de conteúdo..." style="padding:6px 8px;border:1px solid #ccc;border-radius:6px;min-width:220px">
      <button id="send-content-btn" style="background:#1a73e8;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer">Enviar</button>
    </div>

    <script src="script.js"></script>

    <script>
      // Inicializa o dataLayer
      window.dataLayer = window.dataLayer || [];

      function sendEvent(eventName, params = {}) {
        window.dataLayer.push({
          event: eventName,
          ...params,
        });
        console.log("Evento enviado:", eventName, params);
      }

      // Handler para enviar evento select_content com content_type vindo do campo de texto
      (function attachSelectContentHandler() {
        var btn = document.getElementById('send-content-btn');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var input = document.getElementById('content-input');
          var val = (input && input.value) ? String(input.value) : '';
          if (!val.trim()) {
            // Mantemos o padrão de debug do projeto
            console.log('Nenhum conteúdo digitado. Evento select_content não enviado.');
            return;
          }
          sendEvent('select_content', { content_type: val });
        });
      })();
    </script>
  </body>
</html>
